<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 400" width="820" height="400" font-family="'SF Mono', 'Fira Code', 'Consolas', monospace">

  <!-- Fenêtre terminal — fond -->
  <rect width="820" height="400" rx="12" fill="#1e1e1e"/>

  <!-- Barre de titre macOS -->
  <rect width="820" height="36" rx="12" fill="#2d2d2d"/>
  <rect y="24" width="820" height="12" fill="#2d2d2d"/>

  <!-- Boutons macOS -->
  <circle cx="20" cy="18" r="6" fill="#ff5f57"/>
  <circle cx="40" cy="18" r="6" fill="#febc2e"/>
  <circle cx="60" cy="18" r="6" fill="#28c840"/>

  <!-- Titre de la fenêtre -->
  <text x="410" y="23" text-anchor="middle" fill="#9ca3af" font-size="12" font-weight="500">bash — python3 app.py — 82×24</text>

  <!-- Prompt initial -->
  <text x="24" y="68" fill="#4ade80" font-size="13">(venv)</text>
  <text x="76" y="68" fill="#60a5fa" font-size="13">backend</text>
  <text x="138" y="68" fill="#e5e7eb" font-size="13">$</text>
  <text x="154" y="68" fill="#f8fafc" font-size="13">python3 app.py</text>

  <!-- Ligne 1 : modèles chargés -->
  <text x="24" y="96" fill="#4ade80" font-size="13">✅ Modèles chargés</text>

  <!-- Ligne 2 : scaler_clf -->
  <text x="24" y="118" fill="#9ca3af" font-size="13">   scaler_clf :</text>
  <text x="138" y="118" fill="#4ade80" font-size="13">✅</text>

  <!-- Ligne 3 : scaler_clu -->
  <text x="24" y="140" fill="#9ca3af" font-size="13">   scaler_clu :</text>
  <text x="138" y="140" fill="#4ade80" font-size="13">✅</text>

  <!-- Ligne 4 : Dataset CSV -->
  <text x="24" y="162" fill="#4ade80" font-size="13">✅ Dataset CSV chargé</text>
  <text x="196" y="162" fill="#9ca3af" font-size="13">(data/EmployeeAttrition.csv)</text>
  <text x="24" y="180" fill="#9ca3af" font-size="13">   └─</text>
  <text x="52" y="180" fill="#fbbf24" font-size="13">1 470 employés · 35 variables</text>

  <!-- Ligne 5 : Stats clustering -->
  <text x="24" y="202" fill="#4ade80" font-size="13">✅ Stats clustering calculées</text>
  <text x="24" y="220" fill="#9ca3af" font-size="13">   └─ Labels :</text>
  <text x="110" y="220" fill="#a78bfa" font-size="13">Junior · Mid-Level · Senior · Expert</text>

  <!-- Séparateur -->
  <line x1="24" y1="234" x2="796" y2="234" stroke="#374151" stroke-width="1" stroke-dasharray="4,3"/>

  <!-- Ligne Flask serving -->
  <text x="24" y="254" fill="#9ca3af" font-size="13"> * Serving Flask app</text>
  <text x="196" y="254" fill="#f8fafc" font-size="13">'app'</text>

  <!-- Debug mode -->
  <text x="24" y="274" fill="#9ca3af" font-size="13"> * Debug mode:</text>
  <text x="152" y="274" fill="#4ade80" font-size="13">on</text>

  <!-- Warning -->
  <text x="24" y="294" fill="#fbbf24" font-size="12">WARNING: This is a development server. Do not use in production — use Gunicorn instead.</text>

  <!-- Running on -->
  <text x="24" y="316" fill="#9ca3af" font-size="13"> * Running on all addresses</text>
  <text x="238" y="316" fill="#6b7280" font-size="13">(0.0.0.0)</text>

  <text x="24" y="336" fill="#9ca3af" font-size="13"> * Running on</text>
  <text x="130" y="336" fill="#38bdf8" font-size="13" text-decoration="underline">http://127.0.0.1:5001</text>

  <text x="24" y="356" fill="#9ca3af" font-size="13"> * Running on</text>
  <text x="130" y="356" fill="#38bdf8" font-size="13" text-decoration="underline">http://192.168.100.8:5001</text>

  <!-- Press CTRL+C -->
  <text x="24" y="378" fill="#6b7280" font-size="12"> Press</text>
  <text x="62" y="378" fill="#f87171" font-size="12">CTRL+C</text>
  <text x="112" y="378" fill="#6b7280" font-size="12">to quit</text>

  <!-- Curseur clignotant -->
  <rect x="24" y="388" width="8" height="2" fill="#e5e7eb" opacity="0.8"/>

</svg>

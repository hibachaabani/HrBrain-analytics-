<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TalentIQ — HR Analytics Platform</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

      :root {
        /* ── Dark mode (défaut) ── */
        --bg:       #0e1117;
        --bg2:      #141824;
        --bg3:      #1a2035;
        --surface:  rgba(255,255,255,0.05);
        --border:   rgba(255,255,255,0.09);
        --border2:  rgba(255,255,255,0.15);
        --text:     #e8edf5;
        --text2:    rgba(232,237,245,0.6);
        --text3:    rgba(232,237,245,0.35);
        --text4:    rgba(232,237,245,0.2);
        --card-bg:  rgba(255,255,255,0.03);
        --card-bg2: rgba(255,255,255,0.05);
        --input-bg: rgba(255,255,255,0.05);
        --nav-bg:   rgba(14,17,23,0.88);
        --shadow:   rgba(0,0,0,0.3);
        --indigo:   #818cf8;
        --sky:      #38bdf8;
        --emerald:  #34d399;
        --amber:    #fbbf24;
        --rose:     #fb7185;
        --violet:   #a78bfa;
        --mesh1:    rgba(99,102,241,0.1);
        --mesh2:    rgba(56,189,248,0.06);
        --mesh3:    rgba(167,139,250,0.04);
      }

      /* ── Light mode ── */
      [data-theme="light"] {
        --bg:       #f4f6fb;
        --bg2:      #eaecf4;
        --bg3:      #dde1f0;
        --surface:  rgba(0,0,0,0.03);
        --border:   rgba(0,0,0,0.09);
        --border2:  rgba(0,0,0,0.15);
        --text:     #1a1f36;
        --text2:    rgba(26,31,54,0.65);
        --text3:    rgba(26,31,54,0.4);
        --text4:    rgba(26,31,54,0.2);
        --card-bg:  rgba(255,255,255,0.7);
        --card-bg2: rgba(255,255,255,0.9);
        --input-bg: rgba(255,255,255,0.8);
        --nav-bg:   rgba(244,246,251,0.92);
        --shadow:   rgba(99,102,241,0.1);
        --indigo:   #6366f1;
        --sky:      #0ea5e9;
        --emerald:  #10b981;
        --amber:    #f59e0b;
        --rose:     #f43f5e;
        --violet:   #8b5cf6;
        --mesh1:    rgba(99,102,241,0.06);
        --mesh2:    rgba(14,165,233,0.04);
        --mesh3:    rgba(139,92,246,0.03);
      }

      html { scroll-behavior: smooth; }

      body {
        font-family: 'Inter', -apple-system, sans-serif;
        background: var(--bg);
        color: var(--text);
        -webkit-font-smoothing: antialiased;
        min-height: 100vh;
        overflow-x: hidden;
        transition: background 0.3s ease, color 0.3s ease;
      }

      button, input { font-family: inherit; }

      ::-webkit-scrollbar { width: 5px; }
      ::-webkit-scrollbar-track { background: var(--bg); }
      ::-webkit-scrollbar-thumb { background: rgba(129,140,248,0.35); border-radius: 10px; }

      /* ── Animations ── */
      @keyframes fadeUp {
        from { opacity: 0; transform: translateY(24px); }
        to   { opacity: 1; transform: translateY(0); }
      }
      @keyframes fadeIn {
        from { opacity: 0; }
        to   { opacity: 1; }
      }
      @keyframes pulse-dot {
        0%, 100% { box-shadow: 0 0 0 0 rgba(52,211,153,0.6); }
        50%       { box-shadow: 0 0 0 5px rgba(52,211,153,0); }
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
      @keyframes gradient-shift {
        0%   { background-position: 0% 50%; }
        50%  { background-position: 100% 50%; }
        100% { background-position: 0% 50%; }
      }
      @keyframes float {
        0%, 100% { transform: translateY(0); }
        50%       { transform: translateY(-6px); }
      }

      .fade-up  { animation: fadeUp  0.55s cubic-bezier(0.22,1,0.36,1) both; }
      .fade-in  { animation: fadeIn  0.4s ease both; }

      /* ── Gradient text ── */
      .gradient-text {
        background: linear-gradient(135deg, #818cf8 0%, #c084fc 40%, #38bdf8 100%);
        background-size: 200% 200%;
        animation: gradient-shift 4s ease infinite;
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
      }

      /* ── Glass ── */
      .glass {
        background: rgba(255,255,255,0.04);
        backdrop-filter: blur(24px);
        -webkit-backdrop-filter: blur(24px);
        border: 1px solid rgba(255,255,255,0.09);
      }

      /* ── Hover lift ── */
      .card-hover {
        transition: transform 0.25s cubic-bezier(0.22,1,0.36,1),
                    box-shadow 0.25s ease,
                    border-color 0.25s ease,
                    background 0.25s ease;
      }
      .card-hover:hover {
        transform: translateY(-5px);
        box-shadow: 0 24px 48px rgba(0,0,0,0.35);
      }

      /* ── Input ── */
      input[type="number"] {
        -moz-appearance: textfield;
      }
      input[type="number"]::-webkit-inner-spin-button,
      input[type="number"]::-webkit-outer-spin-button {
        -webkit-appearance: none;
      }
      input:focus {
        outline: none;
        border-color: rgba(129,140,248,0.7) !important;
        box-shadow: 0 0 0 3px rgba(129,140,248,0.12) !important;
      }

      /* ── Mesh gradient background ── */
      .mesh-bg {
        position: fixed; inset: 0; z-index: 0; pointer-events: none;
        background:
          radial-gradient(ellipse 80% 50% at 20% 10%, var(--mesh1) 0%, transparent 60%),
          radial-gradient(ellipse 60% 40% at 80% 80%, var(--mesh2) 0%, transparent 60%),
          radial-gradient(ellipse 50% 60% at 50% 50%, var(--mesh3) 0%, transparent 70%);
        transition: background 0.3s ease;
      }

      #root { position: relative; z-index: 1; }
    </style>
  </head>
  <body>
    <div class="mesh-bg"></div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
